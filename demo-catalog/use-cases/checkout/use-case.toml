[use_case]
id = "checkout"
name = "Customer Checkout"
description = "End-to-end checkout flow when a customer completes their purchase. Coordinates order creation, payment processing, and inventory updates."
bpmn = "/bpmn/checkout.bpmn"

[[use_case.participants]]
service = "orders-service"
role = "Creates and manages order lifecycle"

[[use_case.participants]]
service = "billing-service"
role = "Processes payment and generates invoice"

[[use_case.participants]]
service = "catalog-service"
role = "Validates product availability and updates inventory"

[[use_case.steps]]
sequence = 1
actor = "Customer"
action = "Initiates checkout"

[[use_case.steps]]
sequence = 2
service = "orders-service"
action = "Creates pending order"
endpoint = "POST /orders"

[[use_case.steps]]
sequence = 3
service = "catalog-service"
action = "Reserves inventory"
endpoint = "POST /inventory/reserve"

[[use_case.steps]]
sequence = 4
service = "billing-service"
action = "Processes payment"
endpoint = "POST /payments"

[[use_case.steps]]
sequence = 5
service = "orders-service"
action = "Confirms order"
endpoint = "PATCH /orders/{id}/confirm"
